<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE Boutique</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="TopNavBar">
        <div class="container">
            <div class="nav">
                <div class="brand-logo">
                    <h1>LUXE</h1>
                </div>

                <ul class="nav-links">
                    <li><a class="home" href="#">Home</a></li>
                    <li><a href="#">Shop</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Blog</a></li>
                </ul>

                <div class="utility-icons">
                    <button class="search-btn"><img src="./assests/imgs/nav-icons/search.svg" alt="Search"></button>
                    <button class="account-btn"><img src="./assests/imgs/nav-icons/account.svg" alt="Account"></button>
                    <button class="cart-btn"><img src="./assests/imgs/nav-icons/cart.svg" alt="Cart"></button>
                </div>
            </div>
        </div>
    </header>

    <div class="TrendingProducts">

        <div class="container">
            <div class="section-title">
                <div class="norm">
                    <h2>Trending Now</h2>
                    <p>Curated pieces loved by our community.</p>
                </div>
                <a href="#" class="view-all">VIEW ALL COLLECTIONS</a>
            </div>

            <div class="products">
                <div class="product-card">
                    <img class="product-image" src="./assests/imgs/products/Structured Blazer.png"
                        alt="Structured Blazer">
                    <div class="product-details">
                        <h3>Structured Wool Blazer</h3>
                        <div class="rating">
                            <div class="rating-in-Stars">
                                <img src="./assests/imgs/ratings/fullStar.svg" alt="Star">
                                <img src="./assests/imgs/ratings/fullStar.svg" alt="Star">
                                <img src="./assests/imgs/ratings/fullStar.svg" alt="Star">
                                <img src="./assests/imgs/ratings/fullStar.svg" alt="Star">
                                <img src="./assests/imgs/ratings/emptyStar.svg" alt="Empty Star">
                            </div>
                            <div class="number-of-ratings">
                                <p>(24)</p>
                            </div>
                        </div>
                        <p>$245.00</p>
                    </div>
                </div>
                <div class="product-card">
                    <img class="product-image" src="./assests/imgs/products/Organic Cotton Tee.png"
                        alt="Organic Cotton Tee">
                    <div class="product-details">
                        <h3>Organic Cotton Tee</h3>
                        <div class="rating">
                            <div class="rating-in-Stars">
                                <img src="./assests/imgs/ratings/fullStar.svg" alt="Star">
                                <img src="./assests/imgs/ratings/fullStar.svg" alt="Star">
                                <img src="./assests/imgs/ratings/fullStar.svg" alt="Star">
                                <img src="./assests/imgs/ratings/fullStar.svg" alt="Star">
                                <img src="./assests/imgs/ratings/fullStar.svg" alt="Star">
                            </div>
                            <div class="number-of-ratings">
                                <p>(48)</p>
                            </div>
                        </div>
                        <p>$85.00</p>
                    </div>
                </div>
                <div class="product-card">
                    <img class="product-image" src="./assests/imgs/products/Linen Trousers.png" alt="Linen Trousers">
                    <div class="product-details">
                        <h3>Relaxed Linen Trousers</h3>
                        <div class="rating">
                            <div class="rating-in-Stars">
                                <img src="./assests/imgs/ratings/fullStar.svg" alt="Star">
                                <img src="./assests/imgs/ratings/fullStar.svg" alt="Star">
                                <img src="./assests/imgs/ratings/fullStar.svg" alt="Star">
                                <img src="./assests/imgs/ratings/fullStar.svg" alt="Star">
                                <img src="./assests/imgs/ratings/emptyStar.svg" alt="Empty Star">
                            </div>
                            <div class="number-of-ratings">
                                <p>(15)</p>
                            </div>
                        </div>
                        <p>$144.00</p>
                    </div>
                </div>
                <div class="product-card">
                    <img class="product-image" src="./assests/imgs/products/Cashmere Sweater.png"
                        alt="Cashmere Sweater">
                    <div class="product-details">
                        <h3>Sage Cashmere Knitwear</h3>
                        <div class="rating">
                            <div class="rating-in-Stars">
                                <img src="./assests/imgs/ratings/fullStar.svg" alt="Star">
                                <img src="./assests/imgs/ratings/fullStar.svg" alt="Star">
                                <img src="./assests/imgs/ratings/fullStar.svg" alt="Star">
                                <img src="./assests/imgs/ratings/fullStar.svg" alt="Star">
                                <img src="./assests/imgs/ratings/fullStar.svg" alt="Star">
                            </div>
                            <div class="number-of-ratings">
                                <p>(32)</p>
                            </div>
                        </div>
                        <p>$320.00</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
